# Operational settings. Credentials are not stored here.
# Agent CIDRs are Postfix's extra mynetworks ranges and the NetworkPolicy
# sources, so the two cannot drift. Node CIDRs exist so kubelet probes are
# not blocked; replace 192.168.0.0/16 with the node network.

nameOverride: ""
fullnameOverride: ""

mail:
  # Virtual mailbox domain. make charts sets this from MAIL_DOMAIN.
  # This default is used only when the chart is rendered without that variable.
  domain: mail.internal
  # Postfix myhostname. make charts does not change it.
  hostname: mail.internal
  pgsslmode: require
  # vmail owns mailbox files. The directory process creates them on this volume.
  uid: 5000
  gid: 5000
  homeRoot: /var/mail/vhosts

# Private root CA. cert-manager issues it in this namespace and signs the
# Postgres, Dovecot IMAP, and Postfix submission certificates. Istio sidecar
# certificates are signed by the same root through istio-csr. make helm-install
# installs cert-manager before this chart is applied. The CA private key stays
# in the root Secret. Each server mounts only its own leaf Secret.
tls:
  enabled: true
  caDuration: 87600h
  caRenewBefore: 720h
  duration: 8760h
  renewBefore: 720h

# The chart writes the kube-system CoreDNS Corefile. mail.hostname and
# mail.domain resolve to the Postfix Service. The single-label Service names
# Postfix dials resolve to the same Services, because Postfix does not apply
# the pod DNS search list. upstream is the forwarder list already used here.
dns:
  enabled: true
  clusterDomain: cluster.local
  upstream: 9.9.9.9 8.8.8.8 1.1.1.1

# Database role, database name, and password are one Kubernetes Secret.
# secrets.provider chooses who writes it. Pods only read the Secret.
#
# external: External Secrets Operator. This chart creates the ExternalSecret
# and, when secretStore.create is set, a namespaced SecretStore for AWS or
# HashiCorp Vault. It does not install the operator and does not store
# access keys, tokens, the database role, the database name, or the password.
# The remote value is one JSON object. Each key below is a property of that
# object. secretStore.create false references a SecretStore or
# ClusterSecretStore that already exists, so any other provider the operator
# supports is used through the same ExternalSecret. create true writes a
# SecretStore for provider aws or hashicorp. AWS uses the operator identity
# and can assume aws.role. HashiCorp auth is Kubernetes or a token in an
# existing Secret. This chart does not create that token Secret.
#
# vaultwarden: vaultwarden-kubernetes-secrets writes the Secret. This chart
# does not render ExternalSecret or SecretStore and does not store a
# Vaultwarden server URL. On the Vaultwarden item, set namespaces to the
# release namespace and secret-name to the Secret name below.
#
# POSTFIX_PGSQL_PASSWORD_B64 is standard base64, one line, no newline.
# POSTGRES_PASSWORD is that same password in plaintext. The official Postgres
# image reads it directly. The key names below are the Secret keys for both
# providers.
secrets:
  # external or vaultwarden.
  provider: external
externalSecrets:
  refreshInterval: 1h
  # Kubernetes Secret the pods read. Empty means {fullname}-mail-db.
  secretName: ""
  # Pull Secret written when images.registry is set. Empty means
  # {fullname}-registry. The remote property dockerconfigjson is the
  # docker config JSON. This chart does not store the registry login.
  registrySecretName: ""
  # Path or id of the remote JSON object. Empty means {fullname}/mail-db.
  remoteKey: ""
  # Path or id of the registry secret. Empty means {fullname}/registry.
  registryRemoteKey: ""
  secretStore:
    # Empty means {fullname}. A ClusterSecretStore name is required.
    name: ""
    kind: SecretStore
    create: false
    # aws or hashicorp. Required when create is true. Empty when the
    # SecretStore already exists.
    provider: ""
  aws:
    # SecretsManager or ParameterStore.
    service: SecretsManager
    region: ""
    # IAM role ARN the operator assumes. Empty uses the operator identity
    # with no extra assume-role.
    role: ""
  hashicorp:
    # KV mount. The remote key is the path under this mount.
    server: ""
    path: secret
    version: v2
    # Vault Enterprise namespace. Empty on open-source Vault.
    namespace: ""
    # kubernetes or token.
    auth: kubernetes
    kubernetes:
      mountPath: kubernetes
      role: ""
      # Service account whose token Vault reviews. Empty uses the operator
      # service account.
      serviceAccount: ""
    tokenSecretRef:
      name: ""
      key: token
  keys:
    user: POSTFIX_PGSQL_USER
    database: POSTFIX_PGSQL_DBNAME
    passwordB64: POSTFIX_PGSQL_PASSWORD_B64
    postgresUser: POSTGRES_USER
    postgresDatabase: POSTGRES_DB
    postgresPassword: POSTGRES_PASSWORD

postgresql:
  pgdata: /var/lib/postgresql/data/pgdata

networkPolicy:
  enabled: true
  agentCIDRs:
    - 10.42.0.0/16
  nodeCIDRs:
    - 192.168.0.0/16

images:
  # Registry host or host/path for images we build. No URL scheme and no
  # trailing slash. Pass DOCKER_REGISTRY when rendering the chart. Empty
  # keeps each repository as written. A repository that already names a
  # registry host, such as docker.io/library/postgres, stays unchanged.
  #   --set images.registry=$DOCKER_REGISTRY
  registry: ""
  postgres:
    repository: docker.io/library/postgres
    tag: "17"
    pullPolicy: IfNotPresent
  # make sets postfix, dovecot, directory, submission-auth, milter,
  # relay, and maildir tags to the Unix time of that invocation. These
  # defaults apply when the chart is rendered without that override.
  postfix:
    repository: agentmail-postfix
    tag: latest
    pullPolicy: IfNotPresent
  dovecot:
    repository: agentmail-dovecot
    tag: latest
    pullPolicy: IfNotPresent
  directory:
    repository: agentmail-directory
    tag: latest
    pullPolicy: IfNotPresent
  submissionAuth:
    repository: agentmail-submission-auth
    tag: latest
    pullPolicy: IfNotPresent
  milter:
    repository: agentmail-milter
    tag: latest
    pullPolicy: IfNotPresent
  relay:
    repository: agentmail-relay
    tag: latest
    pullPolicy: IfNotPresent
  maildir:
    repository: agentmail-maildir
    tag: latest
    pullPolicy: IfNotPresent

postgres:
  runAsUser: 999
  runAsGroup: 999
  port: 5432
  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

postfix:
  # SMTP listens on 127.0.0.1. With Istio the Service publishes this port
  # and the sidecar forwards mesh clients to it. Submission requires SASL.
  containerPort: 25
  submission:
    containerPort: 587
    servicePort: 587
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# SASL daemon Postfix dials for submission. It checks users.password_hash.
submissionAuth:
  runAsUser: 5003
  runAsGroup: 5003
  containerPort: 50052
  servicePort: 50052
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Milter Postfix dials for inbound SMTP. It accepts local users and lists.
milter:
  runAsUser: 5004
  runAsGroup: 5004
  containerPort: 50053
  servicePort: 50053
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Synchronous SMTP proxy between the mesh and a VPN path to a public MX.
# Off by default. Enabling it does not point Postfix at the relay.
# outboundHost is the public MX address on the VPN. allowCIDRs are the
# only clients accepted on the VPN listener. Both are required when enabled.
relay:
  enabled: false
  runAsUser: 5005
  runAsGroup: 5005
  hostname: ""
  mesh:
    containerPort: 50054
    servicePort: 50054
  vpn:
    containerPort: 50055
  outboundHost: ""
  outboundPort: 25
  allowCIDRs: []
  maxSize: 52428800
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dovecot:
  # fsGroup for the mail volume. The master process runs as root.
  runAsGroup: 5000
  imap:
    containerPort: 143
    servicePort: 143
  lmtp:
    containerPort: 24
    servicePort: 24
  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

directory:
  runAsUser: 5002
  runAsGroup: 5002
  containerPort: 50051
  servicePort: 50051
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Deletes mailbox directories for the directory service. It runs as vmail
# in the directory pod and listens on loopback. It is not a Service port.
maildir:
  runAsUser: 5000
  runAsGroup: 5000
  port: 50056
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Mutual TLS for directory gRPC, Postfix submission, inbound SMTP, the milter,
# the SASL daemon, and Postfix to Dovecot LMTP. SMTP stays bound to 127.0.0.1
# and the sidecar forwards mesh clients to it. IMAP and Postgres stay outside
# mutual TLS. Install istio-base and istiod, sidecar profile, before applying
# this chart. The agentmail client is plaintext and runs in the directory pod.
# Dovecot keeps listening on port 24; lmtpPort is the high port the sidecar accepts.
istio:
  enabled: true
  # Matches the istiod install defaultRevision. Pods that join the mesh
  # carry this label so the revisioned injector selects them.
  revision: default
  systemNamespace: istio-system
  xdsPort: 15012
  # istio-csr signs each sidecar certificate. Egress allows this
  # namespace on the Service port and the container port. Calico matches
  # the port after the Service is translated to the container port.
  csr:
    namespace: cert-manager
    port: 443
    targetPort: 6443
  lmtpPort: 10024
