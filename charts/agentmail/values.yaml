# Operational settings. Credentials are not stored here.
# Agent CIDRs are Postfix's extra mynetworks ranges and the NetworkPolicy
# sources, so the two cannot drift. Node CIDRs exist so kubelet probes are
# not blocked; replace 192.168.0.0/16 with the node network.

nameOverride: ""
fullnameOverride: ""

mail:
  # Virtual mailbox domain. make charts sets this from MAIL_DOMAIN.
  # This default is used only when the chart is rendered without that variable.
  domain: mail.internal
  # Postfix myhostname. make charts does not change it.
  hostname: mail.internal
  pgsslmode: require
  # vmail owns mailbox files. The directory process creates them on this volume.
  uid: 5000
  gid: 5000
  homeRoot: /var/mail/vhosts

# The chart writes the kube-system CoreDNS Corefile. mail.hostname and
# mail.domain resolve to the Postfix Service. The single-label Service names
# Postfix dials resolve to the same Services, because Postfix does not apply
# the pod DNS search list. upstream is the forwarder list already used here.
dns:
  enabled: true
  clusterDomain: cluster.local
  upstream: 9.9.9.9 8.8.8.8 1.1.1.1

# Database role, database name, and password are a Kubernetes Secret written
# by vaultwarden-kubernetes-secrets. This chart does not create that Secret
# and does not store a Vaultwarden server URL.
#
# On the Vaultwarden item, set namespaces to the release namespace and
# secret-name to the Secret name below (empty means {fullname}-mail-db).
# Put each key in this list on the item as a custom field. The password
# field POSTFIX_PGSQL_PASSWORD_B64 is standard base64, one line, no newline:
#   printf '%s' 'the-password' | base64 -w0
# POSTGRES_PASSWORD is that same password in plaintext. The official Postgres
# image reads it directly.
vaultwarden:
  secretName: ""
  # Pull Secret written by vaultwarden-kubernetes-secrets when images.registry
  # is set. Empty means {fullname}-registry. The Vaultwarden item uses
  # secret-type kubernetes.io/dockerconfigjson. This chart does not store
  # the registry username or password.
  registrySecretName: ""
  keys:
    user: POSTFIX_PGSQL_USER
    database: POSTFIX_PGSQL_DBNAME
    passwordB64: POSTFIX_PGSQL_PASSWORD_B64
    postgresUser: POSTGRES_USER
    postgresDatabase: POSTGRES_DB
    postgresPassword: POSTGRES_PASSWORD

postgresql:
  pgdata: /var/lib/postgresql/data/pgdata

networkPolicy:
  enabled: true
  agentCIDRs:
    - 10.42.0.0/16
  nodeCIDRs:
    - 192.168.0.0/16

images:
  # Registry host or host/path for images we build. No URL scheme and no
  # trailing slash. Pass DOCKER_REGISTRY when rendering the chart. Empty
  # keeps each repository as written. A repository that already names a
  # registry host, such as docker.io/library/postgres, stays unchanged.
  #   --set images.registry=$DOCKER_REGISTRY
  registry: ""
  postgres:
    repository: docker.io/library/postgres
    tag: "17"
    pullPolicy: IfNotPresent
  # make sets postfix, dovecot, directory, submission-auth, milter,
  # relay, and maildir tags to the Unix time of that invocation. These
  # defaults apply when the chart is rendered without that override.
  postfix:
    repository: agentmail-postfix
    tag: latest
    pullPolicy: IfNotPresent
  dovecot:
    repository: agentmail-dovecot
    tag: latest
    pullPolicy: IfNotPresent
  directory:
    repository: agentmail-directory
    tag: latest
    pullPolicy: IfNotPresent
  submissionAuth:
    repository: agentmail-submission-auth
    tag: latest
    pullPolicy: IfNotPresent
  milter:
    repository: agentmail-milter
    tag: latest
    pullPolicy: IfNotPresent
  relay:
    repository: agentmail-relay
    tag: latest
    pullPolicy: IfNotPresent
  maildir:
    repository: agentmail-maildir
    tag: latest
    pullPolicy: IfNotPresent

postgres:
  runAsUser: 999
  runAsGroup: 999
  port: 5432
  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

postfix:
  # SMTP listens on 127.0.0.1. With Istio the Service publishes this port
  # and the sidecar forwards mesh clients to it. Submission requires SASL.
  containerPort: 25
  submission:
    containerPort: 587
    servicePort: 587
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# SASL daemon Postfix dials for submission. It checks users.password_hash.
submissionAuth:
  runAsUser: 5003
  runAsGroup: 5003
  containerPort: 50052
  servicePort: 50052
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Milter Postfix dials for inbound SMTP. It accepts local users and lists.
milter:
  runAsUser: 5004
  runAsGroup: 5004
  containerPort: 50053
  servicePort: 50053
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Synchronous SMTP proxy between the mesh and a VPN path to a public MX.
# Off by default. Enabling it does not point Postfix at the relay.
# outboundHost is the public MX address on the VPN. allowCIDRs are the
# only clients accepted on the VPN listener. Both are required when enabled.
relay:
  enabled: false
  runAsUser: 5005
  runAsGroup: 5005
  hostname: ""
  mesh:
    containerPort: 50054
    servicePort: 50054
  vpn:
    containerPort: 50055
  outboundHost: ""
  outboundPort: 25
  allowCIDRs: []
  maxSize: 52428800
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

dovecot:
  # fsGroup for the mail volume. The master process runs as root.
  runAsGroup: 5000
  imap:
    containerPort: 143
    servicePort: 143
  lmtp:
    containerPort: 24
    servicePort: 24
  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

directory:
  runAsUser: 5002
  runAsGroup: 5002
  containerPort: 50051
  servicePort: 50051
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Deletes mailbox directories for the directory service. It runs as vmail
# in the directory pod and listens on loopback. It is not a Service port.
maildir:
  runAsUser: 5000
  runAsGroup: 5000
  port: 50056
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Mutual TLS for directory gRPC, Postfix submission, inbound SMTP, the milter,
# the SASL daemon, and Postfix to Dovecot LMTP. SMTP stays bound to 127.0.0.1
# and the sidecar forwards mesh clients to it. IMAP and Postgres stay outside
# mutual TLS. Install istio-base and istiod, sidecar profile, before applying
# this chart. The agentmail client is plaintext and runs in the directory pod.
# Dovecot keeps listening on port 24; lmtpPort is the high port the sidecar accepts.
istio:
  enabled: true
  # Matches the istiod install defaultRevision. Pods that join the mesh
  # carry this label so the revisioned injector selects them.
  revision: default
  systemNamespace: istio-system
  xdsPort: 15012
  lmtpPort: 10024
