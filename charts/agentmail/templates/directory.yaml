apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.directoryName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "directory" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "directory" "context" .) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "agentmail.componentLabels" (dict "name" "directory" "context" .) | nindent 8 }}
        {{- include "agentmail.meshPodLabels" (dict "component" "directory" "context" .) | nindent 8 }}
      annotations:
        {{- include "agentmail.meshAnnotations" (dict "component" "directory" "context" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.istio.enabled }}
      serviceAccountName: {{ include "agentmail.directoryName" . }}
      {{- end }}
      {{- include "agentmail.imagePullSecrets" . | nindent 6 }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.directory.runAsUser }}
        runAsGroup: {{ .Values.directory.runAsGroup }}
        fsGroup: {{ .Values.mail.gid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: directory
          image: {{ include "agentmail.image" (dict "registry" .Values.images.registry "image" .Values.images.directory) }}
          imagePullPolicy: {{ .Values.images.directory.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.directory.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "agentmail.configMapName" . }}
          env:
            - name: AGENTMAIL_SERVER
              value: {{ printf "%s.%s.svc.cluster.local:%v" (include "agentmail.directoryName" .) .Release.Namespace .Values.directory.servicePort | quote }}
            - name: MAILDIR_SERVER
              value: {{ printf "127.0.0.1:%v" (int .Values.maildir.port) | quote }}
            {{- include "agentmail.pgsqlSecretEnv" . | nindent 12 }}
          securityContext:
            # The directory binary has cap_chown in its file capabilities.
            # false sets NoNewPrivs, and the kernel then ignores that file
            # capability, so CreateUser cannot chown mailboxes to uid 5000.
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: mail
              mountPath: /var/mail
          readinessProbe:
            tcpSocket:
              port: grpc
          livenessProbe:
            tcpSocket:
              port: grpc
          resources:
            {{- toYaml .Values.directory.resources | nindent 12 }}
        - name: maildir
          image: {{ include "agentmail.image" (dict "registry" .Values.images.registry "image" .Values.images.maildir) }}
          imagePullPolicy: {{ .Values.images.maildir.pullPolicy }}
          env:
            - name: MAILDIR_LISTEN
              value: {{ printf "127.0.0.1:%v" (int .Values.maildir.port) | quote }}
            - name: MAIL_HOME_ROOT
              value: {{ .Values.mail.homeRoot | quote }}
          securityContext:
            runAsUser: {{ .Values.maildir.runAsUser }}
            runAsGroup: {{ .Values.maildir.runAsGroup }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: mail
              mountPath: /var/mail
          readinessProbe:
            exec:
              command: ["bash", "-c", {{ printf "echo >/dev/tcp/127.0.0.1/%v" (int .Values.maildir.port) | quote }}]
          livenessProbe:
            exec:
              command: ["bash", "-c", {{ printf "echo >/dev/tcp/127.0.0.1/%v" (int .Values.maildir.port) | quote }}]
          resources:
            {{- toYaml .Values.maildir.resources | nindent 12 }}
      volumes:
        - name: mail
          persistentVolumeClaim:
            claimName: {{ include "agentmail.dovecotName" . }}-data
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.directoryName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "directory" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "agentmail.selectorLabels" (dict "name" "directory" "context" .) | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.directory.servicePort }}
      targetPort: grpc
