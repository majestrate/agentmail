{{- if .Values.relay.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.relayName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "relay" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "relay" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.mesh.containerPort }}
    - from:
        {{- range .Values.relay.allowCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.vpn.containerPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postfix.containerPort }}
    - to:
        - ipBlock:
            cidr: {{ include "agentmail.relayHostCIDR" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.outboundPort }}
    {{- include "agentmail.istioControlEgress" . | nindent 4 }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
