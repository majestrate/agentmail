{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postgresName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postgres" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "postgres" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "directory" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "submission-auth" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postfixName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postfix" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range concat .Values.networkPolicy.agentCIDRs .Values.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postfix.containerPort }}
    - from:
        {{- if .Values.istio.enabled }}
        - podSelector: {}
        {{- else }}
        {{- range .Values.networkPolicy.agentCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postfix.submission.containerPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postgres" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "agentmail.lmtpIngressPort" . }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "submission-auth" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.submissionAuth.containerPort }}
    {{- if .Values.istio.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.istio.systemNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.istio.xdsPort }}
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.submissionAuthName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "submission-auth" "context" .) | nindent 4 }}
spec:
