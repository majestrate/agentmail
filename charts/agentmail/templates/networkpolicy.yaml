{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postgresName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postgres" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "postgres" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "directory" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "submission-auth" "context" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "milter" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postfixName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postfix" "context" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.istio.enabled }}
        - podSelector: {}
        {{- else }}
        {{- range .Values.networkPolicy.agentCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        {{- end }}
        {{- range .Values.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postfix.submission.containerPort }}
    {{- if .Values.istio.enabled }}
    # Inbound SMTP. Mutual TLS is the trust boundary, so any mesh namespace
    # may connect. Agent CIDRs are not a source for this port.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.postfix.containerPort }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "postgres" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ include "agentmail.lmtpIngressPort" . }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "submission-auth" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.submissionAuth.containerPort }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "milter" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.milter.containerPort }}
    {{- if .Values.relay.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "agentmail.selectorLabels" (dict "name" "relay" "context" .) | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.mesh.containerPort }}
    {{- end }}
    {{- include "agentmail.istioControlEgress" . | nindent 4 }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
