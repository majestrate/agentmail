apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postfixName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postfix" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentmail.componentLabels" (dict "name" "postfix" "context" .) | nindent 8 }}
        {{- include "agentmail.meshPodLabels" (dict "component" "postfix" "context" .) | nindent 8 }}
      annotations:
        {{- include "agentmail.meshAnnotations" (dict "component" "postfix" "context" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.istio.enabled }}
      serviceAccountName: {{ include "agentmail.postfixName" . }}
      {{- end }}
      {{- include "agentmail.imagePullSecrets" . | nindent 6 }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "agentmail.migrateContainer" . | nindent 8 }}
      containers:
        - name: postfix
          image: {{ include "agentmail.image" (dict "registry" .Values.images.registry "image" .Values.images.postfix) }}
          imagePullPolicy: {{ .Values.images.postfix.pullPolicy }}
          ports:
            {{- if .Values.istio.enabled }}
            - name: smtp
              containerPort: {{ .Values.postfix.containerPort }}
            {{- end }}
            - name: submission
              containerPort: {{ .Values.postfix.submission.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "agentmail.configMapName" . }}
          env:
            {{- include "agentmail.pgsqlSecretEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - KILL
          # set-permissions and postfix check run before smtpd binds.
          # Liveness waits until this probe succeeds, so a slow start is not killed.
          # The probe uses submission so it works with and without the mesh.
          startupProbe:
            tcpSocket:
              port: submission
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: submission
          livenessProbe:
            tcpSocket:
              port: submission
          resources:
            {{- toYaml .Values.postfix.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.postfixName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "postfix" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "agentmail.selectorLabels" (dict "name" "postfix" "context" .) | nindent 4 }}
  ports:
    # tcp- selects raw TCP in Istio. An unprefixed name is sniffed, and
    # SMTP and submission deadlock because the server writes the banner first.
    {{- if .Values.istio.enabled }}
    - name: tcp-smtp
      port: {{ .Values.postfix.containerPort }}
      targetPort: smtp
    {{- end }}
    - name: tcp-submission
      port: {{ .Values.postfix.submission.servicePort }}
      targetPort: submission
