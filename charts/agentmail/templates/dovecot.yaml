apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.dovecotName" . }}-data
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "dovecot" "context" .) | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.dovecot.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dovecot.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.dovecotName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "dovecot" "context" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "agentmail.componentLabels" (dict "name" "dovecot" "context" .) | nindent 8 }}
      annotations:
        {{- include "agentmail.meshAnnotations" (dict "component" "dovecot" "context" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.istio.enabled }}
      serviceAccountName: {{ include "agentmail.dovecotName" . }}
      {{- end }}
      {{- include "agentmail.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: {{ .Values.dovecot.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "agentmail.migrateContainer" . | nindent 8 }}
      containers:
        - name: dovecot
          image: {{ include "agentmail.image" (dict "registry" .Values.images.registry "image" .Values.images.dovecot) }}
          imagePullPolicy: {{ .Values.images.dovecot.pullPolicy }}
          ports:
            - name: imap
              containerPort: {{ .Values.dovecot.imap.containerPort }}
            - name: lmtp
              containerPort: {{ .Values.dovecot.lmtp.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "agentmail.configMapName" . }}
          env:
            {{- include "agentmail.pgsqlSecretEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - SETUID
                - SETGID
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - KILL
                - SYS_CHROOT
          readinessProbe:
            tcpSocket:
              port: imap
          livenessProbe:
            tcpSocket:
              port: imap
          volumeMounts:
            - name: mail
              mountPath: /var/mail
            - name: runtime
              mountPath: /run/dovecot
          resources:
            {{- toYaml .Values.dovecot.resources | nindent 12 }}
      volumes:
        - name: mail
          persistentVolumeClaim:
            claimName: {{ include "agentmail.dovecotName" . }}-data
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.dovecotName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "dovecot" "context" .) | nindent 4 }}
spec:
  selector:
    {{- include "agentmail.selectorLabels" (dict "name" "dovecot" "context" .) | nindent 4 }}
  ports:
    - name: imap
      port: {{ .Values.dovecot.imap.servicePort }}
      targetPort: imap
    - name: lmtp
      port: {{ include "agentmail.lmtpIngressPort" . }}
      {{- if .Values.istio.enabled }}
      targetPort: {{ .Values.istio.lmtpPort }}
      {{- else }}
      targetPort: lmtp
      {{- end }}
