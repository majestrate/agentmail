apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.secretStoreName" . }}
  labels:
    {{- include "agentmail.labels" . | nindent 4 }}
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: {{ printf "%s/api" (include "agentmail.bitwardenBase" .) | quote }}
      identityURL: {{ printf "%s/identity" (include "agentmail.bitwardenBase" .) | quote }}
      bitwardenServerSDKURL: {{ .Values.bitwarden.sdkURL | quote }}
      organizationID: {{ .Values.bitwarden.organizationID | quote }}
      projectID: {{ .Values.bitwarden.projectID | quote }}
      caProvider:
        type: {{ .Values.bitwarden.ca.type | quote }}
        name: {{ .Values.bitwarden.ca.name | quote }}
        key: {{ .Values.bitwarden.ca.key | quote }}
      auth:
        secretRef:
          credentials:
            name: {{ .Values.bitwarden.authSecret.name | quote }}
            key: {{ .Values.bitwarden.authSecret.key | quote }}
