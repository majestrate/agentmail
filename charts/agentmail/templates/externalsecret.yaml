apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.secretName" . }}
  labels:
    {{- include "agentmail.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.bitwarden.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "agentmail.secretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ include "agentmail.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        POSTFIX_PGSQL_USER: {{ "{{ .user }}" | quote }}
        POSTGRES_USER: {{ "{{ .user }}" | quote }}
        POSTFIX_PGSQL_DBNAME: {{ "{{ .database }}" | quote }}
        POSTGRES_DB: {{ "{{ .database }}" | quote }}
        POSTFIX_PGSQL_PASSWORD_B64: {{ "{{ .passwordb64 }}" | quote }}
        POSTGRES_PASSWORD: {{ "{{ .passwordb64 | b64dec }}" | quote }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ .Values.bitwarden.secrets.user | quote }}
    - secretKey: database
      remoteRef:
        key: {{ .Values.bitwarden.secrets.database | quote }}
    - secretKey: passwordb64
      remoteRef:
        key: {{ .Values.bitwarden.secrets.passwordB64 | quote }}
