{{- if eq .Values.secrets.provider "external" }}
{{- if .Values.externalSecrets.secretStore.create }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.secretStoreName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "external-secrets" "context" .) | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.secretStore.provider "aws" }}
    aws:
      service: {{ .Values.externalSecrets.aws.service | quote }}
      region: {{ .Values.externalSecrets.aws.region | quote }}
      {{- if .Values.externalSecrets.aws.role }}
      role: {{ .Values.externalSecrets.aws.role | quote }}
      {{- end }}
    {{- else }}
    vault:
      server: {{ .Values.externalSecrets.hashicorp.server | quote }}
      path: {{ .Values.externalSecrets.hashicorp.path | quote }}
      version: {{ .Values.externalSecrets.hashicorp.version | quote }}
      {{- if .Values.externalSecrets.hashicorp.namespace }}
      namespace: {{ .Values.externalSecrets.hashicorp.namespace | quote }}
      {{- end }}
      auth:
        {{- if eq .Values.externalSecrets.hashicorp.auth "kubernetes" }}
        kubernetes:
          mountPath: {{ .Values.externalSecrets.hashicorp.kubernetes.mountPath | quote }}
          role: {{ .Values.externalSecrets.hashicorp.kubernetes.role | quote }}
          {{- if .Values.externalSecrets.hashicorp.kubernetes.serviceAccount }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.hashicorp.kubernetes.serviceAccount | quote }}
          {{- end }}
        {{- else }}
        tokenSecretRef:
          name: {{ .Values.externalSecrets.hashicorp.tokenSecretRef.name | quote }}
          key: {{ .Values.externalSecrets.hashicorp.tokenSecretRef.key | quote }}
        {{- end }}
    {{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.secretName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "mail-db" "context" .) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "agentmail.secretStoreName" . }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "agentmail.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    {{- range $key := list .Values.externalSecrets.keys.user .Values.externalSecrets.keys.database .Values.externalSecrets.keys.passwordB64 .Values.externalSecrets.keys.postgresUser .Values.externalSecrets.keys.postgresDatabase .Values.externalSecrets.keys.postgresPassword }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ include "agentmail.remoteKey" $ | quote }}
        property: {{ $key | quote }}
    {{- end }}
{{- if .Values.images.registry }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "agentmail.registrySecretName" . }}
  labels:
    {{- include "agentmail.componentLabels" (dict "name" "registry" "context" .) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "agentmail.secretStoreName" . }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "agentmail.registrySecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ "{{ .dockerconfigjson }}" | quote }}
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: {{ include "agentmail.registryRemoteKey" . | quote }}
        property: dockerconfigjson
{{- end }}
{{- end }}
